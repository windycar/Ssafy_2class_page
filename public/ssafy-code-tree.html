<title>SSAFY · 우리 코드로 만든 트리</title>
<style>
  :root{color-scheme:dark;--ice:#a9dfff;--line:#b6d9f123;--text:#edf7ff;--muted:#a0b3c6}

  #toast{position:absolute;left:50%;bottom:99px;transform:translateX(-50%);padding:11px 18px;border:1px solid var(--line);border-radius:22px;background:#0a1625ed;color:#d7eaff;font-size:13px;max-width:90vw;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
  body.clean .chrome{opacity:0;pointer-events:none}body.clean #clean{opacity:0}body.clean #clean:hover,body.clean #clean:focus-visible{opacity:1}
  @media(max-width:1100px){.caption p{font-size:20px}.hint{display:none}.caption{bottom:110px}.controls{bottom:25px}.masthead{left:24px;top:24px}.edition{right:24px;top:26px}}
  @media(max-width:600px){.masthead{top:20px;left:20px}.masthead strong{font-size:14px}.eyebrow,.edition{font-size:10px}.edition{right:20px;top:21px}.caption{left:20px;bottom:104px}.caption p{font-size:16px;margin-bottom:5px}.caption small{font-size:9px}.controls{gap:0;bottom:max(16px,env(safe-area-inset-bottom));padding:5px}.controls button{font-size:11px;padding:10px 9px;gap:5px}.controls button svg{width:14px;height:14px}.controls .optional{display:none}.divider{margin:0 2px}#clean{right:16px;top:80px}#toast{bottom:84px}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  #code-toggle{color:#dcf5ec;background:#76d5b31d}
  .code-pane{
    position:absolute;top:50%;right:max(clamp(16px,4vw,76px),calc((100vw - 1440px)/2));transform:translateY(-50%);
    width:min(42vw,570px);max-height:calc(100dvh - 160px);display:flex;flex-direction:column;

  }

  .code-head{display:flex;align-items:flex-start;justify-content:space-between;padding:20px 20px 13px;gap:12px}
  .code-head h1{font-size:21px;font-weight:600;margin:0 0 5px;letter-spacing:-.04em}
  .code-head p,.code-meta{font-size:12px;color:#9db7bc;margin:0;line-height:1.5}
  .code-close{width:32px;height:32px;flex:none;border:1px solid var(--line);border-radius:50%;background:#14232b;font-size:21px;line-height:28px}
  .code-files{display:flex;gap:5px;flex-wrap:wrap;padding:0 20px 12px}
  .code-files button{padding:6px 9px;border:1px solid transparent;border-radius:7px;background:transparent;color:#abc2c8;font-size:12px;white-space:nowrap}
  .code-files button[aria-pressed="true"]{background:#15312d;border-color:#70d2ae50;color:#c5f6e3}
  .code-meta{padding:11px 20px 9px;border-top:1px solid var(--line)}

  .py-keyword{color:#c9a8fb}.py-string{color:#aaddac}.py-number{color:#ffcb8a}.py-comment{color:#89a6ae}
  body.code-view .hint,body.code-view .caption{opacity:0}
  @media(max-width:760px){
    .code-pane{top:auto;bottom:82px;right:12px;left:12px;transform:none;width:auto;max-height:51dvh;border-radius:15px}
    .code-head{padding:13px 14px 9px}.code-head h1{font-size:17px}.code-files{padding:0 12px 8px;gap:3px}
    .code-meta{padding:7px 14px}#code-lines{padding:0 14px 12px;font-size:12px}
  }
  @media(max-width:380px){.controls button{padding-inline:6px}}

  body.embedded :is(.masthead,.edition,.caption,.hint,#clean,#theme,.divider,#save,#full){display:none}

  body.embedded .controls{top:12px;right:12px;bottom:auto;left:auto;z-index:3;transform:none;padding:3px}
  body.embedded .controls button{min-height:34px;padding:6px 8px;font-size:11px}
  body.embedded #replay span{display:inline}
  body.embedded .code-pane{top:62px;right:14px;bottom:14px;width:min(44%,540px);max-height:none;transform:none;z-index:2}
  @media(max-width:760px){body.embedded .code-pane{top:auto;right:12px;bottom:12px;left:12px;width:auto;max-height:49dvh}}
  @media(max-width:430px){body.embedded .controls :is(#play,#snow) span{display:none}}
  .note-layer{position:absolute;inset:0;z-index:1;pointer-events:none;--note-width:48px}
  .tree-note{
    position:absolute;top:0;left:0;width:var(--note-width);aspect-ratio:1.06;
    background:none;border:0;padding:0;pointer-events:auto;visibility:hidden;z-index:var(--depth,0);
  }
  .tree-note-paper{
    position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:100%;height:100%;padding:clamp(2px,calc(var(--note-width)*.1),5px);
    border-radius:2px;background:var(--paper);color:#342a25;rotate:var(--tilt);transform-origin:50% 6%;
    box-shadow:2px 5px 10px #00120cb3;transition:scale .15s;
  }
  .tree-note-paper::before{
    content:"";position:absolute;z-index:1;left:27%;right:27%;top:-3px;height:clamp(4px,calc(var(--note-width)*.16),8px);
    rotate:-6deg;background:#f8ddb99e;box-shadow:0 1px 2px #30221635;
  }
  .tree-note-paper::after{
    content:"";position:absolute;right:0;bottom:0;width:calc(var(--note-width)*.16);height:calc(var(--note-width)*.16);
    background:linear-gradient(135deg,#20150a1f 49%,#17271b55 51%);
  }
  .tree-note-preview{
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;
    font-size:max(6px,calc(var(--note-width)*.215));font-weight:700;line-height:1.2;text-align:center;
  }
  .tree-note-author{width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:max(5px,calc(var(--note-width)*.18));line-height:1.1;font-weight:600;color:#654534}
  .tree-note-author[hidden]{display:none}
  .dense-notes .tree-note-paper{gap:1px}
  .dense-notes .tree-note-preview{-webkit-line-clamp:1;line-height:1.1}
  .tree-note:is(:hover,:focus-visible){z-index:500}
  .tree-note:is(:hover,:focus-visible) .tree-note-paper{scale:1.12}
  .tree-note.is-attaching{z-index:600}
  .tree-note.is-attaching .tree-note-paper{animation:note-stick .85s cubic-bezier(.21,.67,.2,1) both}
  @keyframes note-stick{
    0%{opacity:0;transform:translate(95px,-100px) rotate(24deg) scale(1.25)}
    28%{opacity:1;transform:translate(59px,-60px) rotate(-13deg) scale(1.16)}
    67%{transform:translate(0,0) rotate(5deg) scale(1.06)}
    84%{transform:translate(0,1px) rotate(-2deg) scale(.96)}
    100%{opacity:1;transform:none}
  }
  @media(prefers-reduced-motion:reduce){.tree-note.is-attaching .tree-note-paper{animation:none}}
</style>
</head>
<body>
<canvas id="scene" role="img" aria-label="눈 내리는 밤, 금빛 전구와 선물이 장식된 입체 ASCII 크리스마스트리. 꼭대기에는 SSAFY 광주 2반 LED 도트 글자가 빛납니다."></canvas>

</nav>

<script id="python-sources" type="application/json">[{"name": "중첩 JSON", "stage": "AI Python · 학습 노트 예제", "title": "중첩 JSON에서 가격 꺼내기", "filename": "Python 데이터 변환과 중첩 JSON.md", "code": "payload = {\n    \"items\": [\n        {\"title\": \"A\", \"price\": \"12000\"},\n        {\"title\": \"B\", \"price\": None},\n    ]\n}\n\ndef extract_prices(data):\n    result = []\n    for item in data.get(\"items\", []):\n        raw = item.get(\"price\")\n        if raw is None:\n            continue\n        result.append((item[\"title\"], int(raw)))\n    return result\n\nprint(extract_prices(payload))  # [('A', 12000)]"}, {"name": "전기버스", "stage": "알고리즘 · 실습 풀이 발췌", "title": "도달 가능한 가장 먼 충전소 찾기", "filename": "4831.py", "code": "now = 0\nresult = 0\n\nwhile now + K \u003c N:\n    found = False\n\n    for i in range(K, 0, -1):\n        if now + i in charge:\n            now += i\n            result += 1\n            found = True\n            break\n\n    if not found:\n        result = 0\n        break\n\nprint(f\"#{test_case} {result}\")"}, {"name": "숫자 카드", "stage": "알고리즘 · 실습 풀이 발췌", "title": "딕셔너리로 숫자 빈도 세기", "filename": "4834.py", "code": "N=int(input())\na=int(input())\nb=[]\nmany=0\nmax=0\nfor i in range(N):\n    b.append(a%10)\n    a=a//10\n\nc={}\nfor i in b:\n    if i not in c:\n        c[i]=1\n    else:\n        c[i]=c[i]+1\nfor key,value in c.items():\n    if many\u003cvalue:\n        max=key\n        many=value\n    if value==many and max\u003ckey:\n        max=key\n\nprint(f\"#{test_case} {max} {many}\")"}, {"name": "사다리", "stage": "알고리즘 · 실습 풀이 발췌", "title": "도착점에서 사다리를 거슬러 올라가기", "filename": "1210_다른풀이.py", "code": "i = 99\nj = N[99].index(2)\n\n# 맨 위까지 올라가기\nwhile i > 0:\n\n    # 왼쪽에 길이 있으면\n    if j > 0 and N[i][j - 1] == 1:\n\n        # 왼쪽 끝까지 이동\n        while j > 0 and N[i][j - 1] == 1:\n            j -= 1\n\n        # 한 칸 위로\n        i -= 1\n\n    # 오른쪽에 길이 있으면\n    elif j \u003c 99 and N[i][j + 1] == 1:\n\n        # 오른쪽 끝까지 이동\n        while j \u003c 99 and N[i][j + 1] == 1:\n            j += 1\n\n        # 한 칸 위로\n        i -= 1\n\n    # 좌우에 길이 없으면 그냥 위로\n    else:\n        i -= 1\n\nprint(f\"#{test_case} {j}\")"}]</script>
<script>
/*
 * SSAFY Christmas — 라이브러리 없는 단일 파일.
 * 좌표 생성 → Y축 회전 → 원근 투영 → 깊이 버퍼 → ASCII 글리프 그리기.
 * 튜닝: CONFIG의 needleCount / rotationSpeed / snowCount를 수정하세요.
 * SSAFY 글자도 5×7 LED 도트로 직접 그립니다.
 * introDuration: 입자가 모여 트리가 만들어지는 첫 등장 연출 시간입니다.
 */
(() => {
  'use strict';
  const CONFIG = {needleCount:21000,rotationSpeed:0.115,snowCount:480,fps:30,introDuration:6.5};
  const TAU=Math.PI*2, canvas=document.getElementById('scene'),ctx=canvas.getContext('2d',{alpha:false});
  if(!ctx){document.getElementById('toast').textContent='Canvas를 지원하는 최신 브라우저에서 열어 주세요.';return;}
  const $=id=>document.getElementById(id), reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const embedded=window.parent!==window && new URLSearchParams(location.search).get('embed')==='1';
  document.body.classList.toggle('embedded',embedded);
  let W=1,H=1,DPR=1,unit=1,angle=.55,time=0,last=0,lastPaint=0,zoom=1,blue=false,snowing=true,paused=reduceMotion,dragging=false,dragX=0,dragOrigin=0,toastTimer;
  let glyphSize=8,cw=4.9,ch=7.2,cols=1,rows=1,zbuf,ids,pxs,pys,scales,depths,alphas,atlas,starAtlas,ledSprite;
  let introAge=reduceMotion?CONFIG.introDuration:0;
  canvas.setAttribute('aria-busy',String(introAge<CONFIG.introDuration));
  const pythonSources = JSON.parse($('python-sources').textContent);
  const codePane = $('code-pane');
  const codeToggle = $('code-toggle');
  const pointers = new Map();
  const CODE_CELL = 24;
  const CODE_ATLAS_FONT = 15;
  const CODE_CANOPY_TOP = 2.34;
  const codeCharacters = [...new Set(pythonSources.flatMap(({code}) => [...code].filter(char => !/\s/.test(char))))];
  const codeCharacterIndex = new Map(codeCharacters.map((char, index) => [char, index]));
  let codeSourceLines = [], codeLeaves = [], codeAtlas, codeFontSize = 8, codeOrientation = 0;
  let codeView = false, viewMix = 0, targetZoom = 1;
  let sceneX = 0, sceneY = 0, sceneScale = 1, sceneInset = 0, pinchDistance = 0;
  const noteLayer = $('tree-notes');
  const photoLayer = $('tree-photos');
  const noteButtons = new Map();
  const photoButtons = new Map();
  let noteAnchors = [];
  const noteColors = ['#ffe7a0', '#ffd2c8', '#d2edb1', '#cce8ff', '#e6d8ff'];
  const noteTilts = [-7, 7, -6, -8, 5, 9, 4, -6, -5];
  const ornamentSprites = new Map();
  const ornamentImageSprites = new Map();
  let ornaments = [], hangingOrnament = null;
  let placement = null, consumedPlacementId = null, placementCursor = null, sceneTap = null;

  function ornamentAnchor(height, azimuth) {
    const radius = 1.81 * Math.pow(1 - height, .81);
    return { height, azimuth, radius, x: radius * Math.cos(azimuth), y: -1.48 + height * 4.83, z: radius * Math.sin(azimuth), revealAt: 1.69 + height * 2.85 };
  }

  function setOrnaments(items, highlightedId) {
    const previous = ornaments.find(({ id }) => id === highlightedId);
    ornaments = items.map(({ id, kind, height, azimuth, image_data }, index) => ({
      id, kind, image_data,
      ...ornamentAnchor(height ?? .15 + .56 * ((.36 + index * .754877666) % 1),
        azimuth ?? Math.PI / 2 - .55 + index * 2.39996323),
    }));
    const photoIds = new Set(items.filter(({ kind, image_data }) => kind === 'custom' && image_data).map(({ id }) => id));
    for (const [id, button] of photoButtons) {
      if (photoIds.has(id)) continue;
      button.remove();
      photoButtons.delete(id);
    }
    for (const id of photoIds) {
      if (photoButtons.has(id)) continue;
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'tree-photo';
      button.dataset.photoId = id;
      button.hidden = true;
      button.setAttribute('aria-label', '사진 오너먼트 크게 보기');

      button.addEventListener('click', event => { if (event.detail === 0) openPhoto(id); });
      photoButtons.set(id, button);
      photoLayer.append(button);
    }
    const highlighted = ornaments.find(({ id }) => id === highlightedId);
    if (!highlighted || (highlighted.kind === previous?.kind && highlighted.height === previous.height &&

  function openPhoto(id) {
    if (!placement) window.parent.postMessage({ type: 'ssafy-tree:open-photo', id }, location.origin);
  }

  function setPlacement(next) {
    if (next?.id === consumedPlacementId || next?.id === placement?.id) return;
    placement = next ?? null;
    placementCursor = null;
    sceneTap = null;
    document.body.classList.toggle('placing-ornament', Boolean(placement));
    $('ornament-placement-hint').hidden = !placement;
    canvas.setAttribute('aria-keyshortcuts', placement ? 'ArrowUp ArrowDown ArrowLeft ArrowRight Enter Escape' : 'ArrowLeft ArrowRight Space R');

      canvas.setAttribute('aria-description', '방향키로 위치를 고르고 Enter 키로 장식을 다세요. Escape 키로 취소합니다.');

  function pickBranch(screenX, screenY) {
    const px = (screenX - sceneX) / sceneScale;
    const py = (sceneY - screenY) / sceneScale;
    const pitchCos = .978, pitchSin = .208;
    const pitchNorm = pitchCos ** 2 + pitchSin ** 2;

    // Follow the camera ray from the near side to the first surface of the tapered canopy.
    function sample(depth) {
      const perspective = 1 - depth / 7.7;
      const x = px * perspective, projectedY = py * perspective;
      const y = (projectedY * pitchCos + depth * pitchSin) / pitchNorm;
      const z = (depth * pitchCos - projectedY * pitchSin) / pitchNorm;
      const height = (y + 1.48) / 4.83;
      const inside = height >= 0 && height <= 1 && Math.hypot(x, z) <= 1.81 * Math.pow(1 - height, .81);
      return { inside, x, z, height };
    }

    for (let depth = 2.44; depth >= -2.5; depth -= .06) {
      if (!sample(depth).inside) continue;
      let far = depth, near = depth + .06;
      for (let step = 0; step < 10; step++) {
        const mid = (far + near) / 2;
        if (sample(mid).inside) far = mid;
        else near = mid;
      }
      const { x, z, height } = sample(far);
      if (height < .03 || height > .94 || z / Math.hypot(x, z) <= .04 || introTime() < 1.83 + height * 2.85) return null;
      return { height, azimuth: ((Math.atan2(z, x) - angle) % TAU + TAU) % TAU };
    }
    return null;
  }

  function defaultPlacementCursor() {
    const front = ornamentAnchor(.40, Math.PI / 2 - angle);
    return project(front.x, front.y, front.z, Math.cos(angle), Math.sin(angle)).slice(0, 2);
  }

  function finishOrnamentPlacement(position) {
    const { id } = placement;
    setPlacement(null);
    consumedPlacementId = id;
    window.parent.postMessage({
      type: position ? 'ssafy-tree:place-ornament' : 'ssafy-tree:cancel-ornament',
      id,
      ...position,

  }

  function ornamentSize(kind, scale) {

  function drawPlacementPreview(c, s) {
    const position = pickBranch(...(placementCursor ?? defaultPlacementCursor()));
    if (!position) return;
    const { x, y, z } = ornamentAnchor(position.height, position.azimuth);
    const [screenX, screenY, scale] = project(x, y, z, c, s);
    const size = ornamentSize(placement.kind, scale);
    ctx.save();
    ctx.globalAlpha = .8;
    ctx.drawImage(ornamentSprite(placement), screenX - size / 2, screenY - size * .18, size, size);
    ctx.strokeStyle = '#fff3c3';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.arc(screenX, screenY + size * .28, size * .56, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }

    brush.scale(3, 3);
    brush.translate(16, 16);
    brush.rotate(-.075);

    brush.shadowOffsetY = 1.3;
    brush.fillStyle = '#fffdf4';

    brush.fillStyle = '#dfbd82';
    brush.fillRect(12.5, 1.6, 7, 3.6);
    brush.fillStyle = '#e7e1d3';

        brush.strokeStyle = '#f4afae';

      brush.fill(body);
      brush.stroke(body);

        brush.beginPath();
        brush.arc(16, 19, 8.6, .2, 1.24);
        brush.stroke();
      }

        brush.fillRect(14, 13, 4, 16);

        brush.fillRect(14, 14, 5, 6);

  }

  function drawOrnaments(c, s, now) {
    const assemblyTime = introTime();
    const visible = [];
    for (const ornament of ornaments) {
      const facing = (ornament.x * s + ornament.z * c) / ornament.radius;
      const reveal = smooth((assemblyTime - ornament.revealAt) / .4);

      if (button) {

        if (button.hidden !== hidden) button.hidden = hidden;
      }
      if (reveal <= 0) continue;
      if (hangingOrnament?.id === ornament.id && hangingOrnament.start === null) hangingOrnament.start = now;
      if (facing <= .04) continue;
      visible.push({ ornament, facing, reveal, button, screen: project(ornament.x, ornament.y, ornament.z, c, s) });
    }
    visible.sort((a, b) => a.screen[3] - b.screen[3]);

      const size = ornamentSize(ornament.kind, scale);

        button.style.width = `${hitWidth}px`;
        button.style.height = `${size * .92}px`;
        button.style.zIndex = Math.round(100 + depth * 45);
      }

  }

  function buildNoteAnchors(count) {
    if (!count) return [];
    const tierCount = Math.ceil(Math.sqrt(count * .78));
    const tiers = Array.from({ length: tierCount }, (_, index) => {

    });

    let radiusSoFar = 0, assigned = 0;
    return tiers.flatMap((tier, index) => {
      radiusSoFar += tier.radius;
      const totalAssigned = index === tiers.length - 1 ? extraNotes : Math.round(extraNotes * radiusSoFar / totalRadius);
      const tierNotes = 1 + totalAssigned - assigned;
      assigned = totalAssigned;
      const spacing = TAU / tierNotes;
      const start = Math.PI / 2 - .55 + (index % 2) * Math.min(.6, spacing / 2);
      return Array.from({ length: tierNotes }, (_, slot) => {
        const azimuth = start + slot * spacing;
        return { ...tier, azimuth, x: tier.radius * Math.cos(azimuth), z: tier.radius * Math.sin(azimuth) };
      });
    });
  }

  function updatePaperSize() {
    const baseWidth = clamp(W * .094, 26, 48);
    const density = Math.sqrt(11 / Math.max(11, noteAnchors.length));
    const width = Math.max(18, Math.round(baseWidth * density));
    noteLayer.style.setProperty('--note-width', `${width}px`);
    noteLayer.classList.toggle('dense-notes', width < 29);
  }

  if (embedded) {
    noteLayer.hidden = false;
    photoLayer.hidden = false;
    canvas.tabIndex = 0;
    canvas.setAttribute('aria-keyshortcuts', 'ArrowLeft ArrowRight Space R');
    addEventListener('message', (event) => {
      if (event.source !== window.parent || event.origin !== location.origin ||
          event.data?.type !== 'ssafy-tree:notes' || !Array.isArray(event.data.notes)) return;
      const notes = event.data.notes;
      const items = event.data.ornaments;
      if (Array.isArray(items)) setOrnaments(items, event.data.highlightedOrnamentId);
      setPlacement(event.data.ornamentPlacement);
      const imageSources = new Set(ornaments.map((ornament) => ornament.image_data));
      imageSources.add(placement?.image_data);
      for (const source of ornamentImageSprites.keys()) {
        if (!imageSources.has(source)) ornamentImageSprites.delete(source);
      }
      if (notes.length !== noteAnchors.length) {
        noteAnchors = buildNoteAnchors(notes.length);
        updatePaperSize();
      }
      const ids = new Set(notes.map(({ id }) => id));

      for (const [id, button] of noteButtons) {
        if (ids.has(id)) continue;
        noteButtons.delete(id);
        button.remove();
      }

      notes.forEach(({ id, content, author_name, is_sample }, index) => {
        let button = noteButtons.get(id);
        if (!button) {
          button = document.createElement('button');
          button.type = 'button';
          button.className = 'tree-note';
          const paper = document.createElement('span');
          paper.className = 'tree-note-paper';
          const preview = document.createElement('span');
          preview.className = 'tree-note-preview';
          const author = document.createElement('span');
          author.className = 'tree-note-author';

          button.addEventListener('click', () => window.parent.postMessage({ type: 'ssafy-tree:open-note', id }, location.origin));

            const { azimuth } = noteAnchors[index];
            if (Math.sin(azimuth + angle) < .78) {

        const author = button.querySelector('.tree-note-author');

    });
  }

  function positionNotes(cosAngle, sinAngle) {
    const assemblyTime = introTime();
    const paperScale = W<=760 ? 1-.4*viewMix : 1;
    for (const button of noteButtons.values()) {
      const { x, y, z, radius, revealAt } = noteAnchors[Number(button.dataset.anchor)];
      const facing = (x * sinAngle + z * cosAngle) / radius;
      const reveal = smooth((assemblyTime - revealAt) / .4);

      button.style.opacity = reveal * Math.min(1, (facing - .04) / .24);

  }

    $('clean').setAttribute('aria-label',document.body.classList.contains('clean')?'글자와 버튼 다시 표시':'화면의 글자와 버튼 숨기기');
  };$('clean').onclick=clean;
  async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else notify('이 브라우저에서는 전체화면을 지원하지 않습니다.');}catch(e){notify('브라우저의 전체화면 기능을 사용해 주세요.');}}
  $('full').onclick=fullscreen;
  function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);}
  $('save').onclick=()=>{canvas.toBlob(blob=>{if(blob){download(blob,'SSAFY-Christmas.png');notify('트리 사진을 저장했습니다.');}else notify('사진 저장에 실패했습니다. 다시 시도해 주세요.');},'image/png');};
  function handlePointer(event){
    pointers.set(event.pointerId, {x:event.clientX,y:event.clientY});
    if(pointers.size===2){
      const [first,second]=pointers.values();
      const distance=Math.hypot(first.x-second.x,first.y-second.y);
      if(event.type==='pointermove'&&pinchDistance>0&&distance>0){
        setZoom(targetZoom*distance/pinchDistance);
      }
      pinchDistance=distance;
      dragging=false;
      return;
    }
    if(event.type==='pointerdown'){
      dragX=event.clientX;
      dragOrigin=angle;
      dragging=true;
    }else if(dragging){
      angle=dragOrigin-(event.clientX-dragX)*.007;
    }
  }
  function releasePointer(event){
    if (!pointers.delete(event.pointerId)) return;
    if (sceneTap?.id === event.pointerId) sceneTap = null;
    dragging=false;
    pinchDistance=0;
  }

  function startScenePointer(event) {
    if (event.button !== 0) return;
    const photoId = event.target.dataset.photoId;
    if (placement) placementCursor = [event.clientX, event.clientY];
    sceneTap = !pointers.size && (placement || photoId)
      ? { id: event.pointerId, x: event.clientX, y: event.clientY, photoId }
      : null;
    canvas.setPointerCapture(event.pointerId);
    handlePointer(event);
  }

  function moveScenePointer(event) {
    if (placement) placementCursor = [event.clientX, event.clientY];
    if (sceneTap?.id === event.pointerId) {
      if (Math.hypot(event.clientX - sceneTap.x, event.clientY - sceneTap.y) < 7) return;
      sceneTap = null;
    }
    if(pointers.has(event.pointerId))handlePointer(event);
  }

  function endScenePointer(event) {
    const tap = sceneTap?.id === event.pointerId &&
      Math.hypot(event.clientX - sceneTap.x, event.clientY - sceneTap.y) < 7 ? sceneTap : null;
    releasePointer(event);
    if (!tap) return;
    if (tap.photoId) openPhoto(tap.photoId);
    if (placement) {
      const position = pickBranch(event.clientX, event.clientY);
      if (position) finishOrnamentPlacement(position);
      else notify('가지가 있는 곳을 눌러 주세요.');
    }
  }

  for (const target of [canvas, photoLayer]) {
    target.addEventListener('pointerdown', startScenePointer);
    target.addEventListener('pointermove', moveScenePointer);
    target.addEventListener('pointerup', endScenePointer);
    target.addEventListener('pointercancel', releasePointer);
    target.addEventListener('lostpointercapture', releasePointer);
    target.addEventListener('wheel', zoomWithWheel, { passive:false });
  }
  function zoomWithWheel(event){
    const multiplier=event.deltaMode===1?16:event.deltaMode===2?H:1;
    const delta=clamp(event.deltaY*multiplier,-180,180);
    if(embedded&&delta>0&&targetZoom<=1)return;
    event.preventDefault();
    const next=targetZoom*Math.exp(-delta*.00115);
    setZoom(embedded&&delta>0?Math.max(1,next):next);
  }
  if(embedded)noteLayer.addEventListener('wheel',zoomWithWheel,{passive:false});
  addEventListener('keydown',event=>{
    if (placement && event.target === canvas) {
      const steps = { ArrowUp: [0, -12], ArrowDown: [0, 12], ArrowLeft: [-12, 0], ArrowRight: [12, 0] };
      const cursor = placementCursor && pickBranch(...placementCursor) ? placementCursor : defaultPlacementCursor();
      if (event.key === 'Escape') {
        event.preventDefault();
        finishOrnamentPlacement(null);
        return;
      }
      if (event.key === 'Enter') {
        event.preventDefault();
        const position = pickBranch(...cursor);
        if (position) finishOrnamentPlacement(position);
        return;
      }
      if (Object.hasOwn(steps, event.key)) {
        event.preventDefault();
        const [dx, dy] = steps[event.key], next = [cursor[0] + dx, cursor[1] + dy];
        if (pickBranch(...next)) placementCursor = next;
        return;
      }
    }
    if(event.key==='Escape'&&codeView){setZoom(1);return;}
    if(event.target instanceof HTMLButtonElement||codePane.contains(event.target))return;
    if(embedded&&event.target!==canvas)return;
    if(embedded&&(event.key==='ArrowLeft'||event.key==='ArrowRight')){
      event.preventDefault();
      angle+=event.key==='ArrowRight'?Math.PI/8:-Math.PI/8;
    }
    if(event.code==='Space'){event.preventDefault();$('play').click();}
    const key=event.key.toLowerCase();
    if(!embedded&&key==='h')clean();
    if(!embedded&&key==='f')fullscreen();
    if(key==='r')replay();
    if(key==='+'||key==='=')setZoom(targetZoom*1.16);
    if(key==='-')setZoom(targetZoom/1.16);
  });
  addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{last=0;});
  resize();selectCode(0);syncPlay();requestAnimationFrame(render);
})();
</script>
</body>
</html>
